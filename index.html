<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2b1d33" />
  <meta name="description" content="Preservation Panic — a Year 6 Science game for learning food preservation methods." />
  <title>Preservation Panic!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥫</text></svg>" />
</head>
<body>
  <div id="app">
    <canvas id="scene" aria-label="Preservation Panic game scene" role="img"></canvas>
    <div id="boot">
      <div class="boot__logo">Preservation <b>Panic!</b></div>
      <div class="boot__bar"><i></i></div>
      <p class="boot__text">Preparing your preservation station…</p>
    </div>
    <div id="rotate">
      <div class="rotate__icon">📱</div>
      <p>Turn your device sideways to play</p>
    </div>
  </div>
  <noscript>
    <p style="font:16px system-ui;padding:2rem">Preservation Panic needs JavaScript enabled.</p>
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
